# Hyprland config for the uConsole Omarchy-look image.
#
# The look (gaps, borders, blur, animation curves, Tokyo Night colours) is
# taken from Omarchy 3.8.4 -- https://github.com/basecamp/omarchy (MIT).
# The rest is cut down for a 5" handheld with a trackball, and calls nothing
# from Omarchy's own omarchy-* scripts, which are not on this image.
#
# The build script substitutes __HYPR_TRANSFORM__ and __HYPR_MOD__.

# ------------------------------------------------------------------ display
#
# The uConsole panel is a portrait 720x1280 DSI panel mounted sideways.
# transform: 0=normal 1=90 2=180 3=270 (Wayland rotates counter-clockwise, so
# 3 matches the Kali image's `xrandr --rotate right`). If the desktop comes up
# upside down, change it here or rebuild with HYPR_TRANSFORM=1.
monitor = DSI-1, preferred, auto, 1, transform, __HYPR_TRANSFORM__
# Anything else (HDMI on a dock) just gets its preferred mode.
monitor = , preferred, auto, 1

# ----------------------------------------------------------------- programs

$terminal = alacritty
$launcher = fuzzel
$browser  = chromium --ozone-platform=wayland
$files    = nautilus --new-window

# ---------------------------------------------------------------- autostart

exec-once = waybar
exec-once = mako
exec-once = hypridle
exec-once = swaybg -i ~/.config/omarchy-look/background -m fill
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1

# ---------------------------------------------------------------------- env

env = XCURSOR_SIZE,24
env = GDK_BACKEND,wayland,x11
env = QT_QPA_PLATFORM,wayland;xcb
env = SDL_VIDEODRIVER,wayland
env = MOZ_ENABLE_WAYLAND,1
env = ELECTRON_OZONE_PLATFORM_HINT,wayland

# -------------------------------------------------------------------- input

input {
    # The uConsole keyboard is a US layout regardless of where you live.
    kb_layout = us
    follow_mouse = 1
    # The trackball is fast and small; this keeps it controllable.
    sensitivity = 0
    accel_profile = adaptive
}

# ------------------------------------------------------------- look 'n' feel

$activeBorderColor = rgba(33ccffee) rgba(00ff99ee) 45deg
$inactiveBorderColor = rgba(595959aa)

general {
    # Omarchy uses 5/10. On a 1280x720 panel that is a lot of lost screen, so
    # the gaps are halved; the look survives it.
    gaps_in = 3
    gaps_out = 5
    border_size = 2
    col.active_border = $activeBorderColor
    col.inactive_border = $inactiveBorderColor
    resize_on_border = false
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 0

    shadow {
        enabled = true
        range = 2
        render_power = 3
        color = rgba(1a1a1aee)
    }

    # Blur is the single most expensive thing here on a CM4's GPU. Omarchy
    # uses 2 passes; one keeps the frosted look and halves the cost. If the
    # desktop feels sluggish, set enabled = false first.
    blur {
        enabled = true
        size = 2
        passes = 1
        special = true
        brightness = 0.60
        contrast = 0.75
    }
}

animations {
    enabled = yes

    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.5,0.5,0.75,1.0
    bezier = quick,0.15,0,0.1,1

    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint
    animation = windows, 1, 3.79, easeOutQuint
    animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
    animation = windowsOut, 1, 1.49, linear, popin 87%
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces, 0, 0, ease
}

dwindle {
    preserve_split = true
    force_split = 2
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    focus_on_activate = true
}

cursor {
    hide_on_key_press = true
}

# ----------------------------------------------------------------- bindings
#
# Omarchy's key layout, minus everything that needs an omarchy-* script.
# Everything important is also reachable from the Waybar buttons with the
# trackball, so a missing or remapped key never leaves you stuck.

$mod = __HYPR_MOD__

bind = $mod, RETURN, exec, $terminal
bind = $mod, SPACE, exec, $launcher
bind = $mod SHIFT, B, exec, $browser
bind = $mod SHIFT, F, exec, $files
bind = $mod, W, killactive,
bind = $mod, F, fullscreen, 0
bind = $mod, T, togglefloating,
bind = $mod, J, togglesplit,
bind = $mod, ESCAPE, exec, hyprlock
bind = $mod SHIFT, ESCAPE, exit,

bind = $mod, LEFT, movefocus, l
bind = $mod, RIGHT, movefocus, r
bind = $mod, UP, movefocus, u
bind = $mod, DOWN, movefocus, d

bind = $mod SHIFT, LEFT, swapwindow, l
bind = $mod SHIFT, RIGHT, swapwindow, r
bind = $mod SHIFT, UP, swapwindow, u
bind = $mod SHIFT, DOWN, swapwindow, d

bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5

bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Screenshot of a region to the clipboard.
bind = , PRINT, exec, grim -g "$(slurp)" - | wl-copy

bindel = , XF86AudioRaiseVolume, exec, pamixer -i 5
bindel = , XF86AudioLowerVolume, exec, pamixer -d 5
bindl  = , XF86AudioMute, exec, pamixer -t
bindel = , XF86MonBrightnessUp, exec, brightnessctl set 10%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 10%-
