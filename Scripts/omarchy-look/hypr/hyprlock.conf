# Lock screen in Omarchy's Tokyo Night colours.

general {
    hide_cursor = true
}

background {
    monitor =
    path = ~/.config/omarchy-look/background
    color = rgba(1a1b26ff)
    blur_passes = 2
}

input-field {
    monitor =
    size = 400, 60
    outline_thickness = 2
    inner_color = rgba(1a1b26cc)
    outer_color = rgba(7aa2f7ee)
    check_color = rgba(9ece6aee)
    fail_color = rgba(f7768eee)
    font_color = rgba(c0caf5ff)
    font_family = JetBrainsMono Nerd Font
    placeholder_text = Password
    fail_text = Wrong password
    rounding = 0
    shadow_passes = 0
    fade_on_empty = false
    position = 0, 0
    halign = center
    valign = center
}
