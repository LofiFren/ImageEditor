# App launcher. Stands in for Omarchy's Walker, which is not packaged for ARM.

[main]
font=JetBrainsMono Nerd Font:size=11
terminal=alacritty -e
prompt="> "
width=40
lines=10
horizontal-pad=16
vertical-pad=12
inner-pad=6

[colors]
background=1a1b26ee
text=a9b1d6ff
match=7aa2f7ff
selection=7aa2f7ff
selection-text=1a1b26ff
selection-match=1a1b26ff
border=7aa2f7ff

[border]
width=2
radius=0
